<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUDDY</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js"); }</script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #0f172a; color: white; }
    h1 { font-size: 48px; }
    button { font-size: 24px; padding: 20px 40px; margin: 10px; border: none; border-radius: 50px; background: #38bdf8; color: #0f172a; }
    #wakeBtn { background: #a78bfa; }
    #testBtn { font-size: 18px; padding: 12px 24px; background: #94a3b8; }
    select { font-size: 18px; margin: 10px; padding: 8px; max-width: 90%; }
    #heard { font-size: 22px; color: #facc15; min-height: 30px; }
    #answer { font-size: 22px; color: #86efac; min-height: 30px; max-width: 800px; margin: 10px auto; }
    #status { font-size: 16px; color: #94a3b8; min-height: 22px; }
  </style>
</head>
<body>
  <h1>BUDDY</h1>
  <p>Your personal assistant</p>
  <button id="wakeBtn" onclick="toggleWake()">👂 Start Listening</button>
  <br>
  <button id="micBtn" onclick="startListening()">🎤 Tap to Talk</button>
  <p>I will listen in:</p>
  <select id="langList">
    <option value="en-IN">English</option>
    <option value="hi-IN">Hindi</option>
    <option value="gu-IN">Gujarati</option>
  </select>
  <p id="heard"></p>
  <p id="answer"></p>
  <p id="status"></p>
  <p>BUDDY's voice:</p>
  <select id="voiceList">
    <option value="Charon">Charon (informative)</option>
    <option value="Algenib">Algenib (gravelly, deep)</option>
    <option value="Orus">Orus (firm)</option>
    <option value="Alnilam">Alnilam (firm)</option>
    <option value="Puck">Puck (upbeat)</option>
    <option value="Fenrir">Fenrir (excitable)</option>
  </select>
  <br>
  <button id="testBtn" onclick="testVoice()">🔊 Test Voice</button>
  <script>
    var BRAIN_URL = "https://buddy-brain.zaibsama2212.workers.dev";
    var currentAudio = null;
    var playToken = 0;
    var busy = false;
    var busyTimer = null;
    var listening = false;
    var awaiting = false;
    var awaitTimer = null;
    var wakeRec = null;
    var wakeLock = null;
    var WAKE = /\b(hey|hi|hay|hello|okay|ok)[\s,]*(buddy|body|buddi|buddie|bodi|badi)\b|(हे|हेलो|हैलो)\s*(बडी|बड्डी|बॉडी)/i;

    function getLock() {
      if (navigator.wakeLock) {
        navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {});
      }
    }

    function dropLock() {
      if (wakeLock) { try { wakeLock.release(); } catch (x) {} wakeLock = null; }
    }

    function setBusy(v) {
      clearTimeout(busyTimer);
      if (v) {
        busy = true;
        busyTimer = setTimeout(function () { busy = false; }, 60000);
      } else {
        busyTimer = setTimeout(function () { busy = false; }, 700);
      }
    }

    function pickLang(text) {
      if (/[\u0A80-\u0AFF]/.test(text)) return "gu-IN";
      if (/[\u0900-\u097F]/.test(text)) return "hi-IN";
      return "en-IN";
    }

    function browserSpeak(text, done) {
      var msg = new SpeechSynthesisUtterance(text);
      msg.lang = pickLang(text);
      msg.rate = 1.1;
      msg.onend = function () { if (done) done(); };
      msg.onerror = function () { if (done) done(); };
      window.speechSynthesis.speak(msg);
    }

    function splitSentences(text) {
      var parts = text.match(/[^.!?\u0964]+[.!?\u0964]*/g) || [text];
      var merged = [];
      parts.forEach(function (p) {
        p = p.trim();
        if (!p) return;
        if (merged.length && p.length < 25) {
          merged[merged.length - 1] += " " + p;
        } else {
          merged.push(p);
        }
      });
      return merged.slice(0, 4);
    }

    function fetchVoice(sentence, voice) {
      return fetch(BRAIN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tts: sentence, voice: voice })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) { return d.audio ? d : null; })
        .catch(function () { return null; });
    }

    function speak(text) {
      var status = document.getElementById("status");
      playToken++;
      var myToken = playToken;
      setBusy(true);
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      window.speechSynthesis.cancel();
      var sentences = splitSentences(text);
      var voice = document.getElementById("voiceList").value;
      var jobs = sentences.map(function (s) { return fetchVoice(s, voice); });
      status.textContent = "BUDDY is getting its voice ready...";

      function playNext(i) {
        if (myToken !== playToken) return;
        if (i >= jobs.length) {
          status.textContent = listening ? "Listening for 'Hey Buddy'..." : "";
          setBusy(false);
          return;
        }
        jobs[i].then(function (d) {
          if (myToken !== playToken) return;
          if (!d) {
            status.textContent = "Using the basic voice for this part.";
            browserSpeak(sentences[i], function () { playNext(i + 1); });
            return;
          }
          var audio = new Audio("data:" + (d.mime || "audio/wav") + ";base64," + d.audio);
          currentAudio = audio;
          audio.onended = function () { playNext(i + 1); };
          status.textContent = "BUDDY is speaking...";
          audio.play().catch(function () {
            browserSpeak(sentences[i], function () { playNext(i + 1); });
          });
        });
      }
      playNext(0);
    }

    function testVoice() {
      speak("Good morning! How can I help you today?");
    }

    function askBuddy(text) {
      var answer = document.getElementById("answer");
      answer.textContent = "BUDDY is thinking...";
      setBusy(true);
      fetch(BRAIN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          answer.textContent = "BUDDY: " + d.reply;
          speak(d.reply);
        })
        .catch(function () {
          answer.textContent = "BUDDY could not reach its brain.";
          setBusy(false);
        });
    }

    function runCommand(text) {
      document.getElementById("heard").textContent = "You said: " + text;
      if (text.toLowerCase().indexOf("good morning") !== -1) {
        var greet = "Good morning! How can I help you today?";
        document.getElementById("answer").textContent = "BUDDY: " + greet;
        speak(greet);
      } else {
        askBuddy(text);
      }
    }

    function startListening() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var heard = document.getElementById("heard");
      var btn = document.getElementById("micBtn");
      if (!SR) { heard.textContent = "Speech listening is not supported in this browser."; return; }
      if (listening) { heard.textContent = "Stop listening mode first."; return; }
      var rec = new SR();
      rec.lang = document.getElementById("langList").value;
      rec.interimResults = false;
      rec.onstart = function () {
        btn.textContent = "🎤 Listening...";
        heard.textContent = "";
      };
      rec.onresult = function (e) {
        runCommand(e.results[0][0].transcript);
      };
      rec.onerror = function (e) {
        heard.textContent = "Mic problem: " + e.error;
      };
      rec.onend = function () {
        btn.textContent = "🎤 Tap to Talk";
      };
      rec.start();
    }

    function updateWakeBtn() {
      document.getElementById("wakeBtn").textContent = listening ? "⏹ Stop Listening" : "👂 Start Listening";
    }

    function handleHeard(text) {
      var heard = document.getElementById("heard");
      text = (text || "").trim();
      if (!text || busy) return;
      var m = text.match(WAKE);
      if (m) {
        var cmd = text.replace(WAKE, "").replace(/^[\s,.!?]+/, "").trim();
        if (cmd) {
          awaiting = false;
          runCommand(cmd);
        } else {
          heard.textContent = "Heard: " + text;
          awaiting = true;
          clearTimeout(awaitTimer);
          awaitTimer = setTimeout(function () { awaiting = false; }, 20000);
          document.getElementById("answer").textContent = "BUDDY: Yes?";
          speak("Yes?");
        }
        return;
      }
      if (awaiting) {
        awaiting = false;
        clearTimeout(awaitTimer);
        runCommand(text);
      }
    }

    function toggleWake() {
      if (listening) { stopWake(); } else { startWake(); }
    }

    function startWake() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var heard = document.getElementById("heard");
      var status = document.getElementById("status");
      if (!SR) { heard.textContent = "Speech listening is not supported in this browser."; return; }
      listening = true;
      updateWakeBtn();
      getLock();
      status.textContent = "Listening for 'Hey Buddy'...";
      wakeRec = new SR();
      wakeRec.lang = document.getElementById("langList").value;
      wakeRec.continuous = true;
      wakeRec.interimResults = false;
      wakeRec.onresult = function (e) {
        for (var i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) { handleHeard(e.results[i][0].transcript); }
        }
      };
      wakeRec.onerror = function (e) {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          listening = false;
          updateWakeBtn();
          dropLock();
          heard.textContent = "Mic problem: " + e.error;
        }
      };
      wakeRec.onend = function () {
        if (listening) {
          setTimeout(function () { try { wakeRec.start(); } catch (x) {} }, 300);
        } else {
          document.getElementById("status").textContent = "";
        }
      };
      try { wakeRec.start(); } catch (x) {}
    }

    function stopWake() {
      listening = false;
      awaiting = false;
      updateWakeBtn();
      dropLock();
      if (wakeRec) { try { wakeRec.stop(); } catch (x) {} }
      document.getElementById("status").textContent = "";
    }

    document.addEventListener("visibilitychange", function () {
      if (document.hidden && listening) {
        stopWake();
        document.getElementById("heard").textContent = "BUDDY stopped listening because the app was closed. Tap Start Listening again.";
      }
    });
  </script>
</body>
</html>
