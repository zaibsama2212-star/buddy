<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUDDY</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #0f172a; color: white; }
    h1 { font-size: 48px; }
    button { font-size: 24px; padding: 20px 40px; border: none; border-radius: 50px; background: #38bdf8; color: #0f172a; }
    select, input { font-size: 18px; margin: 10px; padding: 8px; max-width: 90%; }
  </style>
</head>
<body>
  <h1>BUDDY</h1>
  <p>Your personal assistant</p>
  <button onclick="sayHello()">Tap to say Good Morning</button>
  <p>Voice:</p>
  <select id="voiceList"></select>
  <p>Deepness (lower = deeper):</p>
  <input type="range" id="pitch" min="0.1" max="1.5" step="0.1" value="0.5">
  <script>
    var voices = [];
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
      var list = document.getElementById("voiceList");
      list.innerHTML = "";
      voices.forEach(function (v, i) {
        var opt = document.createElement("option");
        opt.value = i;
        opt.textContent = v.name + " (" + v.lang + ")";
        list.appendChild(opt);
      });
    }
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function sayHello() {
      var msg = new SpeechSynthesisUtterance("Good morning! How can I help you today?");
      var chosen = voices[document.getElementById("voiceList").value];
      if (chosen) { msg.voice = chosen; msg.lang = chosen.lang; } else { msg.lang = "en-IN"; }
      msg.pitch = parseFloat(document.getElementById("pitch").value);
      msg.rate = 1.1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(msg);
    }
  </script>
</body>
</html>
