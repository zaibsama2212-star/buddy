<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUDDY</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #0f172a; color: white; }
    h1 { font-size: 48px; }
    button { font-size: 24px; padding: 20px 40px; margin: 10px; border: none; border-radius: 50px; background: #38bdf8; color: #0f172a; }
    select, input { font-size: 18px; margin: 10px; padding: 8px; max-width: 90%; }
    #heard { font-size: 22px; color: #facc15; min-height: 30px; }
  </style>
</head>
<body>
  <h1>BUDDY</h1>
  <p>Your personal assistant</p>
  <button onclick="sayHello()">Tap to say Good Morning</button>
  <br>
  <button id="micBtn" onclick="startListening()">🎤 Tap to Talk</button>
  <p>I will listen in:</p>
  <select id="langList">
    <option value="en-IN">English</option>
    <option value="hi-IN">Hindi</option>
    <option value="gu-IN">Gujarati</option>
  </select>
  <p id="heard"></p>
  <p>Voice:</p>
  <select id="voiceList"></select>
  <p>Deepness (lower = deeper):</p>
  <input type="range" id="pitch" min="0.1" max="1.5" step="0.1" value="0.5">
  <script>
    var voices = [];
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
      var list = document.getElementById("voiceList");
      list.innerHTML = "";
      voices.forEach(function (v, i) {
        var opt = document.createElement("option");
        opt.value = i;
        opt.textContent = v.name + " (" + v.lang + ")";
        list.appendChild(opt);
      });
    }
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function speak(text, lang) {
      var msg = new SpeechSynthesisUtterance(text);
      if (lang === "en-IN") {
        var chosen = voices[document.getElementById("voiceList").value];
        if (chosen) { msg.voice = chosen; msg.lang = chosen.lang; } else { msg.lang = "en-IN"; }
      } else {
        msg.lang = lang;
      }
      msg.pitch = parseFloat(document.getElementById("pitch").value);
      msg.rate = 1.1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(msg);
    }

    function sayHello() {
      speak("Good morning! How can I help you today?", "en-IN");
    }

    function startListening() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var heard = document.getElementById("heard");
      var btn = document.getElementById("micBtn");
      if (!SR) { heard.textContent = "Speech listening is not supported in this browser."; return; }
      var lang = document.getElementById("langList").value;
      var rec = new SR();
      rec.lang = lang;
      rec.interimResults = false;
      rec.onstart = function () { btn.textContent = "🎤 Listening..."; heard.textContent = ""; };
      rec.onresult = function (e) {
        var text = e.results[0][0].transcript;
        heard.textContent = "You said: " + text;
        if (text.toLowerCase().indexOf("good morning") !== -1) {
          speak("Good morning! How can I help you today?", "en-IN");
        } else {
          speak("You said: " + text, lang);
        }
      };
      rec.onerror = function (e) { heard.textContent = "Mic problem: " + e.error; };
      rec.onend = function () { btn.textContent = "🎤 Tap to Talk"; };
      rec.start();
    }
  </script>
</body>
</html>
