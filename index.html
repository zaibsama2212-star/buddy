<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUDDY</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 40px 20px; background: #0f172a; color: white; }
    h1 { font-size: 48px; }
    button { font-size: 24px; padding: 20px 40px; margin: 10px; border: none; border-radius: 50px; background: #38bdf8; color: #0f172a; }
    #testBtn { font-size: 18px; padding: 12px 24px; background: #94a3b8; }
    select { font-size: 18px; margin: 10px; padding: 8px; max-width: 90%; }
    #heard { font-size: 22px; color: #facc15; min-height: 30px; }
    #answer { font-size: 22px; color: #86efac; min-height: 30px; max-width: 800px; margin: 10px auto; }
    #status { font-size: 16px; color: #94a3b8; min-height: 22px; }
  </style>
</head>
<body>
  <h1>BUDDY</h1>
  <p>Your personal assistant</p>
  <button id="micBtn" onclick="startListening()">🎤 Tap to Talk</button>
  <p>I will listen in:</p>
  <select id="langList">
    <option value="en-IN">English</option>
    <option value="hi-IN">Hindi</option>
    <option value="gu-IN">Gujarati</option>
  </select>
  <p id="heard"></p>
  <p id="answer"></p>
  <p id="status"></p>
  <p>BUDDY's voice:</p>
  <select id="voiceList">
    <option value="Charon">Charon (informative)</option>
    <option value="Algenib">Algenib (gravelly, deep)</option>
    <option value="Orus">Orus (firm)</option>
    <option value="Alnilam">Alnilam (firm)</option>
    <option value="Puck">Puck (upbeat)</option>
    <option value="Fenrir">Fenrir (excitable)</option>
  </select>
  <br>
  <button id="testBtn" onclick="testVoice()">🔊 Test Voice</button>
  <script>
    var BRAIN_URL = "https://buddy-brain.zaibsama2212.workers.dev";
    var currentAudio = null;

    function pickLang(text) {
      if (/[\u0A80-\u0AFF]/.test(text)) return "gu-IN";
      if (/[\u0900-\u097F]/.test(text)) return "hi-IN";
      return "en-IN";
    }

    function browserSpeak(text) {
      var msg = new SpeechSynthesisUtterance(text);
      msg.lang = pickLang(text);
      msg.rate = 1.1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(msg);
    }

    function speak(text) {
      var status = document.getElementById("status");
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      window.speechSynthesis.cancel();
      status.textContent = "BUDDY is getting its voice ready...";
      fetch(BRAIN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tts: text, voice: document.getElementById("voiceList").value })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.audio) {
            status.textContent = d.error ? d.error : "Voice not available, using the basic voice.";
            browserSpeak(text);
            return;
          }
          var audio = new Audio("data:" + (d.mime || "audio/wav") + ";base64," + d.audio);
          currentAudio = audio;
          audio.onended = function () { status.textContent = ""; };
          status.textContent = "BUDDY is speaking...";
          audio.play().catch(function () {
            status.textContent = "Tap the page once, then try again.";
            browserSpeak(text);
          });
        })
        .catch(function () {
          status.textContent = "Voice not reachable, using the basic voice.";
          browserSpeak(text);
        });
    }

    function testVoice() {
      speak("Good morning! How can I help you today?");
    }

    function askBuddy(text) {
      var answer = document.getElementById("answer");
      answer.textContent = "BUDDY is thinking...";
      fetch(BRAIN_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          answer.textContent = "BUDDY: " + d.reply;
          speak(d.reply);
        })
        .catch(function () {
          answer.textContent = "BUDDY could not reach its brain.";
        });
    }

    function startListening() {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var heard = document.getElementById("heard");
      var btn = document.getElementById("micBtn");
      if (!SR) { heard.textContent = "Speech listening is not supported in this browser."; return; }
      var rec = new SR();
      rec.lang = document.getElementById("langList").value;
      rec.interimResults = false;
      rec.onstart = function () {
        btn.textContent = "🎤 Listening...";
        heard.textContent = "";
      };
      rec.onresult = function (e) {
        var text = e.results[0][0].transcript;
        heard.textContent = "You said: " + text;
        if (text.toLowerCase().indexOf("good morning") !== -1) {
          var greet = "Good morning! How can I help you today?";
          document.getElementById("answer").textContent = "BUDDY: " + greet;
          speak(greet);
        } else {
          askBuddy(text);
        }
      };
      rec.onerror = function (e) {
        heard.textContent = "Mic problem: " + e.error;
      };
      rec.onend = function () {
        btn.textContent = "🎤 Tap to Talk";
      };
      rec.start();
    }
  </script>
</body>
</html>
